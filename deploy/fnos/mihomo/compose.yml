name: mihomo-core

services:
  mihomo:
    image: docker.io/metacubex/mihomo:v1.19.28
    restart: unless-stopped
    command:
      - -d
      - /root/.config/mihomo
      - -f
      - /root/.config/mihomo/config.yaml
    ports:
      # NAS clients use NAS_IP:17890.  The core still listens on 7890 inside Docker.
      - "${MIHOMO_HOST_PORT:-17890}:7890/tcp"
      - "${MIHOMO_HOST_PORT:-17890}:7890/udp"
    volumes:
      # Keep this directory writable.  Mihomo stores provider cache files here.
      - ./config:/root/.config/mihomo
    networks:
      mopanel-net:
        aliases:
          - mihomo

networks:
  # Create this bridge network once before starting either Compose project.
  mopanel-net:
    external: true
    name: mopanel-net
