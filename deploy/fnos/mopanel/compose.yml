name: mopanel-web

services:
  mopanel:
    image: ghcr.io/junmo-zy/mopanel:latest
    restart: unless-stopped
    # FNOS bind-mounted folders are commonly root-owned.  Running both writers
    # with root avoids subscription-save failures caused by UID/GID mismatches.
    # Once verified, this can be changed to the same non-root UID:GID that owns
    # the Mihomo config directory.
    user: "0:0"
    ports:
      - "${MOPANEL_PORT:-1224}:8080"
    environment:
      MIHOMO_API_URL: "http://mihomo:9090"
      # The starter config deliberately keeps the controller private and has no
      # secret.  If you add `secret:` to config.yaml later, put the same value
      # here before restarting this container.
      MIHOMO_SECRET: ""
      MIHOMO_CONFIG_PATH: "/config/config.yaml"
      # This is the path Mihomo itself sees, not the MoPanel mount path.
      MIHOMO_RELOAD_PATH: "/root/.config/mihomo/config.yaml"
    volumes:
      # Must be the same host directory as ../mihomo/config in the Mihomo
      # project.  Set MIHOMO_CONFIG_DIR in .env when the FNOS storage path
      # differs from the supplied default.
      - "${MIHOMO_CONFIG_DIR:-/vol1/1000/docker/mihomo/config}:/config"
    networks:
      - mopanel-net

networks:
  mopanel-net:
    external: true
    name: mopanel-net
